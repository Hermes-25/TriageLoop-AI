name: triageloop

services:
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      TRIAGELOOP_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - triageloop-audit:/app/artifacts/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      TRIAGELOOP_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  triageloop-audit:
