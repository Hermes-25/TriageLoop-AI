  <text x="205" y="145" fill="#cfc5d4" font-family="Segoe UI, Arial, sans-serif" font-size="21">Deadline-aware emergency-department triage under uncertainty</text>
  <line x1="205" y1="211" x2="1020" y2="211" stroke="#655c69" stroke-width="4"/>
