[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "triageloop-api"
version = "0.1.0"
description = "Decision, safety, simulation and audit services for the TriageLoop research prototype."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.scripts]
triageloop-api = "triageloop.api:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["triageloop*"]
